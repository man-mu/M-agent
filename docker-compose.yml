services:
  # PostgreSQL 数据库
  postgres:
    image: docker.1ms.run/library/postgres:17-alpine
    container_name: manmu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manmu}
      POSTGRES_USER: ${POSTGRES_USER:-manmu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manmu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - manmu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manmu} -d ${POSTGRES_DB:-manmu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manmu-network

  # 后端 Spring Boot 应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manmu-backend
    environment:
      # 数据库配置
      MVP_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-manmu}
      MVP_POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-manmu}
      MVP_POSTGRES_USER: ${POSTGRES_USER:-manmu}
      MVP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manmu}
      # MCP 配置
      MCP_QWEATHER_URL: http://qweather-mcp:18090
      # 模型供应商 API Keys
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY:-}
      QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./.local:/app/.local
      - ./.local/mcp-servers-docker.json:/app/.local/mcp-servers.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/app/capabilities"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - manmu-network

  # 前端 Vue.js 应用
  frontend:
    build:
      context: ./ui-vue3
      dockerfile: Dockerfile
    container_name: manmu-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - manmu-network

  # 和风天气 MCP 服务
  qweather-mcp:
    build:
      context: ./tools/local-qweather-mcp
      dockerfile: Dockerfile
    container_name: manmu-qweather-mcp
    environment:
      QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-https://api.qweather.com}
      LOCAL_QWEATHER_MCP_PORT: "18090"
    ports:
      - "18090:18090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - manmu-network

volumes:
  manmu-postgres-data:

networks:
  manmu-network:
    driver: bridge
